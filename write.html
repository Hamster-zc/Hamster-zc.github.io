<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>写文章 · 拾光笔记</title><link rel="stylesheet" href="style.css">
  <style>
    .write-page{max-width:860px;margin:0 auto;padding:75px 0 100px}.write-page h1{font-family:'Noto Serif SC',serif;font-size:42px;margin:12px 0}.write-page>p{color:#89938a;font-size:13px}.write-form{background:#fff;border:1px solid #e4e7e1;padding:30px;margin-top:40px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:11px;font-weight:700;color:#607667}.field input,.field textarea{border:1px solid #dfe4dd;padding:12px;outline:0;border-radius:3px;color:#36443b;background:#fcfcfa}.field input:focus,.field textarea:focus{border-color:#8fa993}.field textarea{min-height:320px;resize:vertical;line-height:1.7}.full{grid-column:1 / -1}.write-actions{display:flex;align-items:center;gap:20px;margin-top:24px}.write-actions button{border:0}.download-note{font-size:11px;color:#98a098}.write-back{display:inline-block;font-size:12px;color:#6e8371}.write-tip{margin:28px 0 0;padding:18px;background:#edf2eb;color:#6c806f;font-size:12px;line-height:1.8}@media(max-width:650px){.write-page{padding:55px 0}.write-page h1{font-size:34px}.write-form{padding:20px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.write-actions{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><div class="page-shell"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">✳</span><span>拾光笔记<small>NOTES & THOUGHTS</small></span></a><a class="write-back" href="index.html">← 返回博客</a></header><main class="write-page"><span class="section-kicker">WRITE SOMETHING DOWN</span><h1>写一篇新文章<span class="heading-dot">.</span></h1><p>填写信息后下载 Markdown 文件，把它放进项目的 <code>posts</code> 文件夹即可发布。</p><form class="write-form" id="write-form"><div class="form-grid"><div class="field"><label for="title">文章标题</label><input id="title" required placeholder="例如：今天学到的一个概念"></div><div class="field"><label for="date">发布日期</label><input id="date" type="date" required></div><div class="field"><label for="category">分类</label><input id="category" required value="学习笔记" placeholder="学习笔记 / 随笔"></div><div class="field"><label for="tags">标签</label><input id="tags" placeholder="用逗号分隔，例如：阅读, 思考"></div><div class="field full"><label for="summary">摘要</label><input id="summary" required placeholder="用一句话介绍这篇文章"></div><div class="field full"><label for="body">正文（支持 Markdown）</label><textarea id="body" required placeholder="从这里开始写...\n\n## 一个小标题\n\n记录你的想法。"></textarea></div></div><div class="write-actions"><button class="primary-button" type="submit">下载 Markdown <span aria-hidden="true">↓</span></button><span class="download-note" id="download-note">文件名会根据标题自动生成</span></div></form><div class="write-tip">发布步骤：下载文件 → 放入 <strong>posts</strong> 文件夹 → 运行 <strong>npm run build</strong> → 提交到 GitHub。GitHub Pages 会自动更新。</div></main><footer class="site-footer"><div><span class="footer-symbol">✳</span> 拾光笔记 <span class="footer-muted">/ 把日子写成文字</span></div><p>静态博客 · Markdown 驱动</p></footer></div><script>const date=document.querySelector('#date');date.value=new Date().toISOString().slice(0,10);const slugify=value=>value.trim().toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g,'-').replace(/^-|-$/g,'')||'new-post';document.querySelector('#write-form').addEventListener('submit',event=>{event.preventDefault();const get=id=>document.querySelector('#'+id).value.trim();const text=['---',`title: ${get('title')}`,`date: ${get('date')}`,`category: ${get('category')}`,`summary: ${get('summary')}`,`tags: ${get('tags')}`,'---','',get('body'),''].join('\n');const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`${get('date')}-${slugify(get('title'))}.md`;link.click();URL.revokeObjectURL(link.href);document.querySelector('#download-note').textContent='已开始下载，可以放入 posts 文件夹';});</script></body>
</html>
